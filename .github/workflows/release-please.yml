# Runs release-please on every merge to main.
#
# release-please inspects Conventional Commit messages since the last release
# and determines the correct semver bump (patch / minor / major). It then opens
# (or updates) a "Release PR" that contains the bumped version and a generated
# CHANGELOG entry. Merging that Release PR creates the vX.Y.Z git tag and a
# GitHub Release automatically.
#
# Commit types that drive the version bump:
#   fix: …        → patch bump  (e.g. 0.1.19 → 0.1.20)
#   feat: …       → minor bump  (e.g. 0.1.19 → 0.2.0)
#   feat!: … /
#   BREAKING CHANGE: …  → major bump  (e.g. 0.1.19 → 1.0.0)
#
# See: https://github.com/googleapis/release-please

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  build-release-tarball:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          lfs: true
          fetch-depth: 0

      - name: Create source tarball with LFS artifacts
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          TARBALL="grape-${TAG}.tar.gz"
          git lfs pull
          tar czf "/tmp/${TARBALL}" \
            --exclude='.git' \
            --transform "s|^\.|grape-${TAG}|" \
            .
          echo "TARBALL=/tmp/${TARBALL}" >> "$GITHUB_ENV"
          echo "TARBALL_NAME=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload tarball to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${TARBALL}" \
            --repo "${{ github.repository }}"

      - name: Add LFS warning to release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          EXISTING_BODY="$(gh release view "${TAG}" --repo "${{ github.repository }}" --json body -q '.body')"
          WARNING="> [!WARNING]
          > The auto-generated **Source code** archives (zip/tar.gz) at the bottom of this release do **not** include Git LFS files and are incomplete. Use **\`${TARBALL_NAME}\`** attached above instead.

          "
          gh release edit "${TAG}" \
            --repo "${{ github.repository }}" \
            --notes "${WARNING}${EXISTING_BODY}"
