# Validates that every PR title follows the Conventional Commits specification.
# This ensures release-please can determine the correct semver bump automatically.
#
# Valid prefixes: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test
# A "!" suffix (e.g. feat!:) or a footer containing "BREAKING CHANGE:" triggers a major bump.
#
# See: https://www.conventionalcommits.org

name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
